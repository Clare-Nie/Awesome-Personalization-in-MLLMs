<svg width="800" height="260" viewBox="0 0 800 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="260" fill="#0d1117"/>

  <!-- 暗黑系科技感微网格 -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <!-- 顶部四色渐变线 -->
    <linearGradient id="top-gradient" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f9f8f"/>
      <stop offset="33%" stop-color="#7a4ef3"/>
      <stop offset="66%" stop-color="#0b6b92"/>
      <stop offset="100%" stop-color="#b45a00"/>
    </linearGradient>
  </defs>
  <rect width="800" height="260" fill="url(#grid)"/>

  <!-- 顶部的彩色装饰细条 -->
  <rect x="0" y="0" width="800" height="4" fill="url(#top-gradient)"/>

  <!-- 主标题文字 -->
  <text x="400" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Awesome Personalization in MLLMs</text>

  <!-- 副标题文字 -->
  <text x="400" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#8b949e" text-anchor="middle">A Comprehensive Survey and Frontier Tracking</text>

  <!-- 四大核心方向的彩色标签 (Pills) -->
  <g transform="translate(130, 185)">
    <!-- Memory -->
    <rect x="0" y="0" width="115" height="30" rx="15" fill="#0f9f8f" fill-opacity="0.1" stroke="#0f9f8f" stroke-width="1.5"/>
    <text x="57.5" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#0f9f8f" text-anchor="middle">Memory</text>

    <!-- Alignment -->
    <rect x="135" y="0" width="115" height="30" rx="15" fill="#7a4ef3" fill-opacity="0.1" stroke="#7a4ef3" stroke-width="1.5"/>
    <text x="192.5" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#7a4ef3" text-anchor="middle">Alignment</text>

    <!-- Retrieval -->
    <rect x="270" y="0" width="115" height="30" rx="15" fill="#0b6b92" fill-opacity="0.1" stroke="#0b6b92" stroke-width="1.5"/>
    <text x="327.5" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#0b6b92" text-anchor="middle">Retrieval</text>

    <!-- Evaluation -->
    <rect x="405" y="0" width="125" height="30" rx="15" fill="#b45a00" fill-opacity="0.1" stroke="#b45a00" stroke-width="1.5"/>
    <text x="467.5" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#b45a00" text-anchor="middle">Evaluation</text>
  </g>
</svg>
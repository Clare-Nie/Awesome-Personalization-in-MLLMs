<svg xmlns="http://www.w3.org/2000/svg" width="1732" height="826" viewBox="0 0 1732 826" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Personalization in MLLMs</title>
  <desc id="desc">A clean banner for a personalization survey, centered on human-AI interaction and four research areas: memory, alignment, retrieval, and evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fbfa"/>
      <stop offset="0.55" stop-color="#f7f8ff"/>
      <stop offset="1" stop-color="#fff9ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#152638" flood-opacity="0.14"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <style>
      .title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 78px; font-weight: 850; fill: #162231; letter-spacing: 0; }
      .subtitle { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 30px; font-weight: 560; fill: #536273; letter-spacing: 0; }
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 38px; font-weight: 820; fill: #172433; letter-spacing: 0; }
      .micro { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; font-weight: 650; fill: #627284; letter-spacing: 0; }
      .card { fill: rgba(255,255,255,0.92); stroke: rgba(70,86,104,0.14); stroke-width: 2; }
      .link { fill: none; stroke: #b9c9d9; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10 14; }
    </style>
  </defs>

  <rect width="1732" height="826" fill="url(#bg)"/>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome Personalization in MLLMs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #ffffff; 
            color: #111827; 
        }
        .stat-box { 
            background-color: #f6f6f6; 
            border-radius: 12px; 
            padding: 16px 24px; 
            text-align: center; 
        }
        .stat-num { 
            font-size: 2.25rem; 
            font-weight: 700; 
            color: #111827; 
            line-height: 1.2;
        }
        .stat-label { 
            font-size: 0.875rem; 
            color: #6b7280; 
            margin-top: 4px; 
        }
        .paper-card { 
            border: 1px solid #e5e7eb; 
            border-radius: 12px; 
            padding: 24px; 
            margin-bottom: -1px; /* Overlap borders */
            transition: all 0.2s; 
            display: block; 
            text-decoration: none; 
            background: white;
        }
        .paper-card:first-child {
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }
        .paper-card:last-child {
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            margin-bottom: 0;
        }
        .paper-card:hover { 
            border-color: #7a4ef3; 
            box-shadow: 0 4px 12px rgba(122, 78, 243, 0.08); 
            z-index: 10;
            position: relative;
        }
        .filter-btn { 
            border: 1px solid #e5e7eb; 
            border-radius: 9999px; 
            padding: 6px 16px; 
            font-size: 0.875rem; 
            color: #4b5563; 
            transition: all 0.2s; 
            cursor: pointer; 
            white-space: nowrap; 
            background: white;
        }
        .filter-btn:hover { 
            border-color: #d1d5db; 
            background-color: #f9fafb; 
        }
        .filter-btn.active { 
            border-color: #7a4ef3; 
            color: #7a4ef3; 
        }
        .cat-badge { 
            padding: 4px 10px; 
            border-radius: 9999px; 
            font-size: 0.75rem; 
            font-weight: 600; 
        }
    </style>
</head>
<body class="antialiased min-h-screen">
    <div class="max-w-5xl mx-auto px-6 py-16">
        
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-start gap-10 mb-12">
            <div class="flex-1">
                <h1 class="text-3xl font-bold text-gray-900 mb-3 tracking-tight">Awesome Personalization in MLLMs</h1>
                <p class="text-gray-600 mb-5 text-[17px]">A curated collection of research on personalizing LLMs and MLLMs, covering memory, alignment, retrieval, and evaluation.</p>
                <div class="inline-flex items-center px-4 py-1.5 rounded-full border border-gray-200 text-xs font-medium text-gray-500 bg-white">
                    <svg class="w-3.5 h-3.5 mr-1.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 17L17 7M17 7H7M17 7V17"></path></svg>
                    Auto-synced from GitHub README
                </div>
            </div>
            
            <div class="flex gap-4 shrink-0">
                <div class="stat-box min-w-[110px]">
                    <div class="stat-num" id="stat-papers">--</div>
                    <div class="stat-label">Papers</div>
                </div>
                <div class="stat-box min-w-[130px]">
                    <div class="stat-num" id="stat-years">----</div>
                    <div class="stat-label">Coverage</div>
                </div>
            </div>
        </div>

        <hr class="border-gray-100 mb-10">

        <!-- Controls Section -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-2">
            <div class="w-full md:w-96 relative">
                <input type="text" id="searchInput" placeholder="Search titles, venues..." class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:border-[#7a4ef3] focus:ring-1 focus:ring-[#7a4ef3] transition shadow-sm">
            </div>
            
            <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 hide-scrollbar" id="filterContainer">
                <button class="filter-btn active" data-cat="All">All</button>
                <button class="filter-btn" data-cat="Memory">Memory</button>
                <button class="filter-btn" data-cat="Alignment">Alignment</button>
                <button class="filter-btn" data-cat="Retrieval">Retrieval</button>
                <button class="filter-btn" data-cat="Evaluation">Evaluation</button>
            </div>
        </div>
        
        <div class="text-[15px] font-medium text-gray-500 mb-10" id="countDisplay">Loading papers...</div>

        <!-- Papers List -->
        <div id="papersContainer" class="space-y-12"></div>
    </div>

    <script>
        let allPapers = [];
        
        const catColors = {
            'Memory': '#0f9f8f',
            'Alignment': '#7a4ef3',
            'Retrieval': '#0b6b92',
            'Evaluation': '#b45a00'
        };

        async function init() {
            try {
                let text = '';
                try {
                    // Try to load local file first for Live Server / Local viewing
                    const res = await fetch('../README.md');
                    if (res.ok) text = await res.text();
                    else throw new Error('Local file not found');
                } catch (e) {
                    // Fallback to fetch from raw github for GitHub Pages
                    const res = await fetch('https://raw.githubusercontent.com/Clare-Nie/Awesome-Personalization-in-MLLMs/main/README.md');
                    text = await res.text();
                }

                parseReadme(text);
                render();
            } catch (err) {
                document.getElementById('papersContainer').innerHTML = '<p class="text-red-500 font-medium">Failed to load data from repository. Please try again later.</p>';
                console.error('Data Loading Error:', err);
            }
        }

        function parseReadme(text) {
            const lines = text.split('\n');
            let currentCat = '';
            
            for (let line of lines) {
                // Determine current section via headers
                if (line.includes('Personalized Memory')) currentCat = 'Memory';
                else if (line.includes('Personalized Alignment')) currentCat = 'Alignment';
                else if (line.includes('Personalized Retrieval')) currentCat = 'Retrieval';
                else if (line.includes('Benchmarks and Evaluation')) currentCat = 'Evaluation';
                
                // Parse table rows corresponding to papers
                if (line.startsWith('|') && !line.includes('---') && !line.includes('Date | Paper Title') && !line.includes('Direction | Core Question')) {
                    const parts = line.split('|').map(p => p.trim()).filter(p => p);
                    // Match valid date format like 2026.05
                    if (parts.length >= 4 && /^\d{4}\.\d{2}$/.test(parts[0])) {
                        const date = parts[0];
                        const year = date.split('.')[0];
                        
                        let title = parts[1];
                        let url = '#';
                        const titleMatch = title.match(/\[(.*?)\]\((.*?)\)/);
                        if (titleMatch) {
                            title = titleMatch[1];
                            url = titleMatch[2];
                        }
                        
                        const venue = parts[2];
                        const pub = parts[3];
                        
                        let github = '';
                        if (parts[4]) {
                            const ghMatch = parts[4].match(/\[.*?\]\((.*?)\)/);
                            if (ghMatch) github = ghMatch[1];
                        }
                        
                        // Push robust paper object
                        if (currentCat && currentCat !== '') {
                            allPapers.push({
                                date, year, title, url, venue, pub, github, category: currentCat
                            });
                        }
                    }
                }
            }
            
            // Set header stats
            document.getElementById('stat-papers').textContent = allPapers.length;
            const years = allPapers.map(p => parseInt(p.year)).filter(y => !isNaN(y));
            if (years.length > 0) {
                document.getElementById('stat-years').textContent = `${Math.min(...years)}–${Math.max(...years)}`;
            }
        }

        function render() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const activeCat = document.querySelector('.filter-btn.active').dataset.cat;
            
            const filtered = allPapers.filter(p => {
                const matchSearch = p.title.toLowerCase().includes(query) || p.venue.toLowerCase().includes(query);
                const matchCat = activeCat === 'All' || p.category === activeCat;
                return matchSearch && matchCat;
            });
            
            document.getElementById('countDisplay').textContent = `Showing ${filtered.length} of ${allPapers.length} papers`;
            
            // Group by year
            const grouped = {};
            filtered.forEach(p => {
                if (!grouped[p.year]) grouped[p.year] = [];
                grouped[p.year].push(p);
            });
            
            const sortedYears = Object.keys(grouped).sort((a,b) => b - a);
            const container = document.getElementById('papersContainer');
            container.innerHTML = '';
            
            sortedYears.forEach(year => {
                const yearSection = document.createElement('div');
                
                // Elegant year heading
                yearSection.innerHTML = `
                    <h2 class="text-[17px] font-bold text-gray-500 tracking-wide mb-6 uppercase">${year}</h2>
                    <div class="flex flex-col year-card-group"></div>
                `;
                
                const groupContainer = yearSection.querySelector('.year-card-group');

                grouped[year].forEach(p => {
                    const color = catColors[p.category] || '#888';
                    const hex = color.replace('#', '');
                    const r = parseInt(hex.substring(0,2), 16);
                    const g = parseInt(hex.substring(2,4), 16);
                    const b = parseInt(hex.substring(4,6), 16);
                    
                    const card = document.createElement('a');
                    card.href = p.url;
                    card.target = '_blank';
                    card.className = 'paper-card group flex flex-col md:flex-row md:items-center justify-between gap-4';
                    
                    // Simple text tag for Github
                    let ghHtml = p.github ? `
                        <div class="mt-2 md:mt-0 flex items-center justify-center shrink-0">
                            <object data="${p.github}" type="text/html" onclick="event.stopPropagation()">
                                <a href="${p.github}" target="_blank" onclick="event.stopPropagation()" class="inline-flex items-center justify-center bg-gray-50 hover:bg-gray-100 text-[#7a4ef3] px-3 py-1.5 rounded-md text-sm font-medium transition border border-gray-200">
                                    <svg class="w-4 h-4 mr-1.5 text-gray-500" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.379.203 2.394.1 2.647.64.699 1.026 1.592 1.026 2.683 0 3.842-2.339 4.687-4.565 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.416 22 12c0-5.523-4.477-10-10-10z"></path></svg>
                                    Code
                                </a>
                            </object>
                        </div>
                    ` : '';
                    
                    card.innerHTML = `
                        <div class="flex-1 pr-4">
                            <h3 class="text-[17px] font-semibold text-gray-900 group-hover:text-[#7a4ef3] transition mb-2.5 leading-snug">${p.title}</h3>
                            <div class="flex flex-wrap items-center gap-2.5">
                                <span class="cat-badge" style="background-color: rgba(${r},${g},${b},0.08); color: ${color}">${p.category}</span>
                                <span class="text-sm font-medium bg-gray-100 text-gray-600 px-2 py-0.5 rounded">${p.date}</span>
                                <span class="text-sm text-gray-500 bg-white border border-gray-100 px-2 py-0.5 rounded shadow-sm">${p.venue}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-5 justify-end">
                            ${ghHtml}
                            <svg class="w-5 h-5 text-gray-300 group-hover:text-[#7a4ef3] transition shrink-0 hidden md:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                    `;
                    groupContainer.appendChild(card);
                });
                
                container.appendChild(yearSection);
            });
        }

        // Setup listeners
        document.getElementById('searchInput').addEventListener('input', render);
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                render();
            });
        });

        // Bootstrap
        init();
    </script>
</body>
</html>
